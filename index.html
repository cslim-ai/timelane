<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#20282f">
  <meta name="description" content="Compare local times around the world with Seoul as a reference." data-i18n-content="description">
  <title data-i18n="title">TimeLane · World Clock</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles.css?v=4">
  <script defer src="./assets/timelane.js?v=7"></script>
</head>
<body>
  <a class="skip-link" href="#timeline" data-i18n="skipToTimeline">Skip to timeline</a>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="TimeLane home" data-i18n-label="home"><img src="./assets/icon.svg" alt="" width="34" height="34"><strong>TimeLane</strong></a>
    <span class="header-label" data-i18n="worldClock">World Clock</span>
    <div class="live-clock">
      <span id="clock-source" class="clock-source" data-source="device">
        <button type="button" class="clock-source-icon" aria-label="Time source" data-i18n-label="clockSource" aria-describedby="clock-source-tooltip" aria-expanded="false" aria-controls="clock-source-tooltip">
          <svg class="source-server" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2.5" y="3" width="15" height="6" rx="1.5"/><rect x="2.5" y="11" width="15" height="6" rx="1.5"/><path d="M6 6h.5M6 14h.5" stroke-linecap="round"/>
          </svg>
          <svg class="source-device" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2.5" y="3" width="15" height="10.5" rx="1.5"/><path d="M10 13.5V17m-3.5 0h7" stroke-linecap="round"/>
          </svg>
        </button>
        <span id="clock-source-tooltip" class="clock-source-tooltip" role="tooltip" data-i18n="clockDeviceSource">Time from this device’s system clock.</span>
      </span>
      <span data-i18n="seoulLive">Seoul local time</span><time id="live-time">--:--:--</time>
    </div>
  </header>
  <main>
    <h1 class="sr-only" data-i18n="worldComparison">Compare world times</h1>
    <section class="workspace" aria-label="Compare world times" data-i18n-label="worldComparison">
      <div class="toolbar">
        <div class="search-wrap">
          <label class="search-field"><span aria-hidden="true" class="search-icon">⌕</span><input id="city-search" type="search" autocomplete="off" placeholder="Add a city or time zone" data-i18n-placeholder="searchPlaceholder" aria-label="Search cities and time zones" data-i18n-label="searchLabel" aria-expanded="false" aria-controls="search-results" role="combobox"></label>
          <div id="search-results" class="search-results" role="listbox" aria-label="City search results" data-i18n-label="searchResults" hidden></div>
        </div>
        <div class="date-navigation">
          <button id="previous-day" class="icon-button" aria-label="Previous day" data-i18n-label="previousDay">‹</button>
          <label class="date-field"><span id="date-label"></span><input id="date-picker" type="date" min="1900-01-01" max="2100-12-31" aria-label="Comparison date" data-i18n-label="comparisonDate"></label>
          <button id="next-day" class="icon-button" aria-label="Next day" data-i18n-label="nextDay">›</button>
        </div>
        <label class="format-field"><span class="sr-only" data-i18n="timeFormat">Time format</span><select id="time-format"><option value="24" data-i18n="twentyFourHours">24-hour</option><option value="12" data-i18n="twelveHours">12-hour</option></select></label>
      </div>
      <div class="timeline-caption">
        <p><strong data-i18n="seoulReference">Seoul reference</strong><span id="reference-offset">UTC+09:00</span></p>
        <button id="current-time" class="button" type="button" aria-controls="timeline" aria-label="Return to current time" data-i18n="now" data-i18n-label="returnToNow">Now</button>
      </div>
      <div class="timeline-scroll" id="timeline-scroll"><div id="timeline" class="timeline" tabindex="-1" aria-label="Compare times by city" data-i18n-label="cityComparison"></div></div>
      <div class="timeline-footer"><div class="legend"><span><i class="legend-day" aria-hidden="true"></i><span data-i18n="day">Day</span></span><span><i class="legend-evening" aria-hidden="true"></i><span data-i18n="evening">Evening</span></span><span><i class="legend-night" aria-hidden="true"></i><span data-i18n="night">Night</span></span></div><p id="comparison-status" data-i18n="comparisonHint">Click an hour to center it. Drag or scroll over the timeline to browse.</p></div>
    </section>
    <p id="save-status" class="save-status" data-i18n="saved">Your cities are saved in this browser.</p>
  </main>
  <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
  <noscript><p class="notice">Enable JavaScript to view the timeline.</p></noscript>
</body>
</html>
